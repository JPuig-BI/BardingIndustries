<body class="card-body">

  <main class="business-card">
    <div class="card-content">

      <div class="card-brand">
        <a href="https://bardingindustries.com" aria-label="Barding Industries">
          <img src="../assets/img/logo.png" alt="Barding Industries" />
        </a>
      </div>

      <header class="card-header">
        <div class="profile-img-container" data-card-field="photo"></div>
        <h1 class="name" data-card-field="name"></h1>
        <h2 class="role" data-card-field="role"></h2>
        <p class="credential" data-card-field="credential"></p>
        <p class="tagline" data-card-field="tagline"></p>
      </header>

      <section class="card-section" data-card-section="affiliations">
        <h2 class="section-title">Affiliations</h2>
        <ul class="info-list" role="list"></ul>
      </section>

      <section class="card-section">
        <h2 class="section-title">Contact</h2>
        <ul class="info-list contact-list" role="list" data-card-field="contact-list"></ul>
      </section>

      <div class="social-links" aria-label="Social profiles" data-card-field="socials"></div>

      <footer class="card-footer">
        <button data-save-contact class="btn btn-primary" aria-label="Save Jaume Puig to contacts">
          <i class="fa-solid fa-address-card" aria-hidden="true"></i> Save Contact
        </button>
        <a href="#" class="btn-text" data-card-field="primary-link"></a>
        <p class="card-updated" data-card-field="updated"></p>
      </footer>

    </div>

    <div id="copy-toast" class="toast hidden" aria-live="polite">Copied to clipboard</div>
  </main>
